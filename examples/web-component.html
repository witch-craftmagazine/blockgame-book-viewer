<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Book - Web Component Demo</title>
  <link rel="icon" type="image/png" href="../assets/textures/gui/book.png" />
  <link rel="stylesheet" href="../src/styles/viewer.css" />
  <style>
    body {
      background: #1a1a1a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 {
      font-size: 20px;
      color: #ffaa00;
    }
    .container {
      width: 800px;
      height: 480px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    .code-box {
      background: #0d0d0d;
      border: 1px solid #282828;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      color: #79c0ff;
      max-width: 800px;
      width: 100%;
    }
    a {
      color: #ffaa00;
    }
  </style>
</head>
<body>
  <h1>&lt;minecraft-book&gt; Web Component Example</h1>
  <p><a href="../index.html">← Back to Playground</a></p>

  <div class="code-box">
    &lt;minecraft-book src="../assets/books/intro.stendhal" view-mode="double" base-path="../assets"&gt;&lt;/minecraft-book&gt;
  </div>

  <div class="container">
    <minecraft-book
      src="../assets/books/intro.stendhal"
      view-mode="double"
      base-path="../assets"
      theme="dark"
      controls="true">
    </minecraft-book>
  </div>

  <script type="module" src="../src/index.ts"></script>
</body>
</html>
