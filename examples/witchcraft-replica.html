<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>witchcraft...magazine (Modular Engine Replica)</title>
  <link rel="icon" type="image/png" href="../assets/textures/gui/book_icon.png" />
  <link rel="stylesheet" href="../src/styles/unifont.css" />
  <link rel="stylesheet" href="../src/styles/viewer.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }
    .reader-viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .canvas-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient animated ASCII art backdrop */
    .ascii-ambient-wrapper {
      position: fixed;
      inset: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 1;
      overflow: hidden;
    }
    .ascii-ambient-pre {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: pre;
      font-variant-ligatures: none;
      color: var(--ascii-color, rgba(215, 195, 255, 0.85));
      text-shadow: 0 0 6px var(--ascii-glow, rgba(180, 140, 240, 0.40));
      transition: color 0.5s ease, opacity 0.5s ease;
      will-change: contents;
    }
    .ascii-ambient-pre[data-scene="study"],
    .ascii-ambient-wrapper[data-scene="study"] .ascii-ambient-pre {
      --ascii-color: rgba(255, 215, 130, 0.85);
      --ascii-glow: rgba(240, 180, 70, 0.40);
    }
    .ascii-ambient-pre[data-scene="meadow"],
    .ascii-ambient-wrapper[data-scene="meadow"] .ascii-ambient-pre {
      --ascii-color: rgba(190, 240, 145, 0.85);
      --ascii-glow: rgba(140, 220, 90, 0.40);
    }
    .ascii-ambient-pre[data-scene="halloween"],
    .ascii-ambient-wrapper[data-scene="halloween"] .ascii-ambient-pre {
      --ascii-color: rgba(255, 170, 60, 0.88);
      --ascii-glow: rgba(230, 110, 20, 0.45);
    }
    .ascii-ambient-pre[data-scene="winter"],
    .ascii-ambient-wrapper[data-scene="winter"] .ascii-ambient-pre {
      --ascii-color: rgba(215, 240, 255, 0.90);
      --ascii-glow: rgba(180, 220, 255, 0.45);
    }
    .ascii-ambient-pre[data-scene="celestial"],
    .ascii-ambient-wrapper[data-scene="celestial"] .ascii-ambient-pre {
      --ascii-color: rgba(225, 195, 255, 0.88);
      --ascii-glow: rgba(190, 150, 250, 0.45);
    }
    .ascii-ambient-pre[data-scene="static"],
    .ascii-ambient-wrapper[data-scene="static"] .ascii-ambient-pre {
      --ascii-color: rgba(255, 85, 85, 0.90);
      --ascii-glow: rgba(255, 50, 50, 0.45);
    }

    /* Floating Magazine Selector Header */
    .magazine-nav {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: linear-gradient(180deg, #d8cbaf 0%, #c4b595 100%);
      border: 1px solid #5a4128;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      padding: 6px 14px;
    }
    .magazine-nav-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .magazine-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 12px;
      border-right: 1px solid rgba(90, 65, 40, 0.35);
      text-decoration: none;
      cursor: pointer;
      color: #2b1d0e;
      font-family: 'Sorts Mill Goudy', Georgia, serif;
      font-style: italic;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: opacity 0.2s ease;
    }
    .magazine-brand:hover { opacity: 0.85; }
    .magazine-brand-icon {
      font-size: 15px;
      line-height: 1;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.4));
    }
    .magazine-selector-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .issue-scroll-container {
      display: flex;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 380px;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      mask-image: linear-gradient(to right, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
      padding: 2px 6px;
      cursor: grab;
    }
    .issue-scroll-container:active { cursor: grabbing; }
    .issue-scroll-container::-webkit-scrollbar { display: none; }
    .issue-scroll-track {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .issue-chip {
      font-family: 'Sorts Mill Goudy', Georgia, serif;
      background: #ede3cc;
      border: 1px solid #7c5c37;
      color: #3b2814;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: all 0.15s ease;
      user-select: none;
    }
    .issue-chip:hover {
      background: #f5eedf;
      border-color: #4a341e;
      color: #1a0f05;
      transform: translateY(-1px);
    }
    .issue-chip.active {
      background: #4a2810;
      border-color: #2b1404;
      color: #fbf5e6;
      font-weight: 600;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5), 0 1px 1px rgba(255, 255, 255, 0.3);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .nav-arrow-btn, .nav-icon-btn {
      font-family: 'Sorts Mill Goudy', Georgia, serif;
      background: #e2d6bc;
      border: 1px solid #7c5c37;
      color: #3b2814;
      cursor: pointer;
      font-size: 12px;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: all 0.15s ease;
    }
    .nav-arrow-btn:hover, .nav-icon-btn:hover {
      background: #f2e8d4;
      border-color: #4a341e;
      color: #1a0f05;
    }
    .nav-arrow-btn:active, .nav-icon-btn:active {
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
      transform: translateY(1px);
    }
    .nav-icon-btn.active {
      background: #4a2810;
      color: #fbf5e6;
      border-color: #2b1404;
    }
    .magazine-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 12px;
      border-left: 1px solid rgba(90, 65, 40, 0.35);
    }
    .magazine-page-info {
      font-family: 'Sorts Mill Goudy', Georgia, serif;
      font-size: 14px;
      font-style: italic;
      color: #4a3520;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    /* Share toast */
    .share-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(32, 22, 14, 0.95);
      color: #f7eedb;
      border: 1px solid #8e6a3e;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 6px;
      font-family: 'Sorts Mill Goudy', Georgia, serif;
      font-size: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90vw;
      text-align: center;
    }
    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .back-link {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 30;
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      background: rgba(20, 20, 20, 0.8);
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #333;
    }
    .back-link:hover { color: #fff; }

    @media (max-width: 680px) {
      .magazine-nav {
        top: 8px;
        width: 96%;
        max-width: 96%;
        padding: 4px 8px;
        border-radius: 18px;
      }
      .magazine-brand {
        display: none;
      }
      .issue-scroll-container {
        max-width: 200px;
      }
    }
    @media (max-width: 380px) {
      .issue-scroll-container {
        max-width: 140px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <a href="../index.html" class="back-link">← Back to Playground</a>
  <script type="module" src="./witchcraft-replica.ts"></script>
</body>
</html>
