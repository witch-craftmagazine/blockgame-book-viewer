<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Book Viewer & Playground</title>
  <link rel="icon" type="image/png" href="./assets/textures/gui/book.png" />
  <link rel="stylesheet" href="./src/styles/viewer.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header.playground-nav {
      background: #1c1c1c;
      border-bottom: 1px solid #333;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #ffaa00;
      text-decoration: none;
    }
    .brand img {
      width: 24px;
      height: 24px;
      image-rendering: pixelated;
    }
    .demo-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .demo-selector select {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .demo-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #333;
      transition: all 0.2s;
    }
    .demo-links a:hover {
      background: #333;
      color: #fff;
    }
    main#viewer-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
  </style>
</head>
<body>
  <header class="playground-nav">
    <a href="#" class="brand">
      <img src="./assets/textures/gui/book.png" alt="Book Icon" />
      <span>Minecraft Book Viewer</span>
    </a>
    <div class="demo-selector">
      <label for="book-select">Sample Books:</label>
      <select id="book-select">
        <option value="welcome">Welcome & Guide</option>
        <option value="issue1">Witch-Craft Issue 1</option>
        <option value="issue2">Witch-Craft Issue 2</option>
        <option value="issue3">Witch-Craft Issue 3</option>
        <option value="issue2023">Issue X (2023)</option>
        <option value="intro">The Story So Far (Intro)</option>
      </select>
    </div>
    <div class="demo-links">
      <a href="./examples/web-component.html">Web Component Demo</a>
      <a href="./examples/witchcraft-replica.html">Witch-Craft Replica</a>
    </div>
  </header>
  <main id="viewer-container"></main>

  <script type="module" src="./src/playground.ts"></script>
</body>
</html>
